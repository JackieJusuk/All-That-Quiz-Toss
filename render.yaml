# Render Blueprint — 대시보드에서 New > Blueprint로 이 저장소를 선택하면 백엔드 서비스가 생성된다.
# 서비스 이름이 곧 URL(https://all-that-quiz.onrender.com)이 되며, .env.production의 VITE_API_BASE와 같아야 한다.
services:
  - type: web
    name: all-that-quiz
    runtime: node
    branch: master
    buildCommand: npm install
    startCommand: npm run server
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
