<title>캐시퀴즈 목업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ground:#eef0f6;
  --panel:#ffffff;
  --ink:#15171f;
  --ink-soft:#666b7a;
  --line:#dfe2ec;

  --phone-bg:#f7f8fc;
  --surface:#ffffff;
  --surface-2:#eef1fb;

  --accent:#3d5afe;
  --accent-soft:#e8ecff;
  --gold:#b9800f;
  --gold-soft:#faf1dc;
  --good:#1f8f5c;
  --good-soft:#e6f7ef;
  --bad:#d94848;
  --bad-soft:#fdecec;

  --font-kr:'Gothic A1', 'Apple SD Gothic Neo', ui-sans-serif, system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0f1015;
    --panel:#181a22;
    --ink:#eceef5;
    --ink-soft:#989db0;
    --line:#2b2e3b;

    --phone-bg:#101219;
    --surface:#1a1c26;
    --surface-2:#20222e;

    --accent:#93a4ff;
    --accent-soft:#242c52;
    --gold:#e0a83f;
    --gold-soft:#3a2e14;
    --good:#40c886;
    --good-soft:#123424;
    --bad:#f17771;
    --bad-soft:#3a1c1c;
  }
}
:root[data-theme="dark"]{
  --ground:#0f1015;
  --panel:#181a22;
  --ink:#eceef5;
  --ink-soft:#989db0;
  --line:#2b2e3b;

  --phone-bg:#101219;
  --surface:#1a1c26;
  --surface-2:#20222e;

  --accent:#93a4ff;
  --accent-soft:#242c52;
  --gold:#e0a83f;
  --gold-soft:#3a2e14;
  --good:#40c886;
  --good-soft:#123424;
  --bad:#f17771;
  --bad-soft:#3a1c1c;
}

*{box-sizing:border-box;}
*:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
button{font:inherit;}

body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font-kr);
}

.page{
  max-width:760px;
  margin:0 auto;
  padding:2.75rem 1.25rem 4rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1.75rem;
}

/* ---- reviewer chrome ---- */
.head{max-width:34rem; text-align:center;}
.eyebrow{
  font-family:var(--font-mono);
  font-size:0.68rem;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--accent);
  margin:0 0 0.6rem;
}
h1{
  font-size:clamp(1.4rem, 1.15rem + 1vw, 1.8rem);
  font-weight:900;
  margin:0 0 0.55rem;
  text-wrap:balance;
}
.head p{
  color:var(--ink-soft);
  font-size:0.92rem;
  margin:0;
}

.jumpbar{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:0.5rem;
}
.jump{
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--ink-soft);
  padding:0.45rem 0.9rem;
  border-radius:999px;
  font-size:0.82rem;
  font-weight:500;
  cursor:pointer;
}
.jump.active{
  border-color:var(--accent);
  color:var(--accent);
  background:var(--accent-soft);
  font-weight:700;
}

/* ---- device ---- */
.device-wrap{
  width:min(380px, 88vw);
}
.device{
  position:relative;
  width:100%;
  aspect-ratio:375/812;
  background:var(--surface);
  border-radius:2.6rem;
  border:1px solid var(--line);
  box-shadow:0 30px 60px -25px rgba(20,22,35,0.35), 0 2px 0 rgba(20,22,35,0.03);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.statusbar{
  flex:none;
  height:2.6rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 1.3rem 0 1.5rem;
  font-family:var(--font-mono);
  font-size:0.72rem;
  font-weight:600;
  color:var(--ink);
  background:var(--phone-bg);
}
.statusbar .icons{display:flex; gap:0.3rem; align-items:center;}
.statusbar svg{display:block;}

.screen{
  flex:1;
  min-height:0;
  background:var(--phone-bg);
  display:flex;
  flex-direction:column;
}

.scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:0.9rem 1.1rem 1.2rem;
}
.scroll::-webkit-scrollbar{width:0;height:0;}

/* ---- home screen ---- */
.top-chips{
  display:flex;
  gap:0.5rem;
  margin-bottom:1.1rem;
}
.chip{
  flex:1;
  display:flex;
  align-items:center;
  gap:0.4rem;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:0.55rem 0.7rem;
}
.chip svg{flex:none;}
.chip .v{
  font-family:var(--font-mono);
  font-weight:600;
  font-size:0.85rem;
  font-variant-numeric:tabular-nums;
  line-height:1.1;
}
.chip .l{font-size:0.66rem; color:var(--ink-soft); line-height:1.1;}
.chip.gold .v{color:var(--gold);}
.chip.streak .v{color:#e2662a;}

.greet{
  font-size:1.15rem;
  font-weight:900;
  margin:0 0 0.2rem;
  text-wrap:balance;
}
.greet-sub{
  font-size:0.85rem;
  color:var(--ink-soft);
  margin:0 0 1.2rem;
}

.section-label{
  font-family:var(--font-mono);
  font-size:0.66rem;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin:0 0 0.55rem;
}

.topics{display:flex; flex-direction:column; gap:0.6rem;}
.topic-card{
  display:flex;
  align-items:center;
  gap:0.85rem;
  width:100%;
  text-align:left;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:16px;
  padding:0.85rem 0.9rem;
  cursor:pointer;
}
.topic-card:active{transform:scale(0.98);}
.topic-ic{
  flex:none;
  width:2.6rem;height:2.6rem;
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
}
.topic-body{flex:1; min-width:0;}
.topic-name{font-weight:700; font-size:0.95rem;}
.topic-desc{font-size:0.76rem; color:var(--ink-soft); margin-top:0.1rem;}
.topic-chev{flex:none; color:var(--ink-soft);}

/* ---- quiz screen ---- */
.quiz-head{
  flex:none;
  display:flex;
  align-items:center;
  gap:0.7rem;
  padding:0.8rem 1.1rem 0.6rem;
}
.iconbtn{
  border:none;
  background:var(--surface-2);
  color:var(--ink);
  width:2rem;height:2rem;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  flex:none;
}
.progress-track{
  flex:1;
  height:6px;
  background:var(--surface-2);
  border-radius:999px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:var(--accent);
  border-radius:999px;
  transition:width 0.25s ease;
}
.qcount{
  font-family:var(--font-mono);
  font-size:0.74rem;
  color:var(--ink-soft);
  flex:none;
  font-variant-numeric:tabular-nums;
}

.qtext{
  font-size:1.05rem;
  font-weight:700;
  line-height:1.45;
  margin:0.4rem 0 1.1rem;
  text-wrap:balance;
}

.choices{display:flex; flex-direction:column; gap:0.55rem;}
.choice{
  display:flex;
  align-items:center;
  gap:0.65rem;
  width:100%;
  text-align:left;
  border:1.5px solid var(--line);
  background:var(--surface);
  border-radius:14px;
  padding:0.75rem 0.85rem;
  font-size:0.9rem;
  cursor:pointer;
  color:var(--ink);
}
.choice .mark{
  flex:none;
  width:1.5rem;height:1.5rem;
  border-radius:50%;
  border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);
  font-size:0.72rem;
  color:var(--ink-soft);
}
.choice.correct{border-color:var(--good); background:var(--good-soft);}
.choice.correct .mark{border-color:var(--good); color:var(--good); background:transparent;}
.choice.wrong{border-color:var(--bad); background:var(--bad-soft);}
.choice.wrong .mark{border-color:var(--bad); color:var(--bad);}
.choice[disabled]{cursor:default;}

.explain{
  margin-top:1rem;
  padding:0.85rem 0.95rem;
  border-radius:14px;
  background:var(--surface-2);
  font-size:0.83rem;
  color:var(--ink-soft);
  line-height:1.55;
}
.explain b{color:var(--ink); font-weight:700;}

.quiz-foot{
  flex:none;
  padding:0.7rem 1.1rem 1rem;
}
.btn-primary{
  width:100%;
  border:none;
  background:var(--accent);
  color:#fff;
  font-weight:700;
  font-size:0.92rem;
  padding:0.85rem;
  border-radius:14px;
  cursor:pointer;
}
.btn-primary:disabled{opacity:0.4; cursor:default;}
.btn-ghost{
  width:100%;
  border:1.5px solid var(--line);
  background:transparent;
  color:var(--ink);
  font-weight:700;
  font-size:0.92rem;
  padding:0.8rem;
  border-radius:14px;
  cursor:pointer;
  margin-top:0.55rem;
}

/* ---- result screen ---- */
.result-wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:1.5rem 1.4rem;
  text-align:center;
  gap:0.35rem;
}
.result-score{
  font-family:var(--font-mono);
  font-size:2.6rem;
  font-weight:600;
  color:var(--accent);
  line-height:1;
  margin-bottom:0.3rem;
}
.result-title{font-size:1.05rem; font-weight:900; margin:0 0 0.3rem;}
.result-sub{font-size:0.83rem; color:var(--ink-soft); margin:0 0 1.3rem;}
.result-stats{
  display:flex;
  gap:0.6rem;
  width:100%;
  margin-bottom:1.6rem;
}
.result-stat{
  flex:1;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:0.75rem 0.5rem;
}
.result-stat .v{
  font-family:var(--font-mono);
  font-weight:600;
  font-size:1.05rem;
  font-variant-numeric:tabular-nums;
}
.result-stat.gold .v{color:var(--gold);}
.result-stat .l{font-size:0.68rem; color:var(--ink-soft); margin-top:0.15rem;}
.result-actions{width:100%;}

/* ---- wrongnote screen ---- */
.wnote-item{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:14px;
  margin-bottom:0.6rem;
  overflow:hidden;
}
.wnote-head{
  width:100%;
  display:flex;
  align-items:center;
  gap:0.6rem;
  padding:0.75rem 0.85rem;
  background:none;
  border:none;
  text-align:left;
  cursor:pointer;
  color:var(--ink);
}
.wnote-tag{
  flex:none;
  font-family:var(--font-mono);
  font-size:0.66rem;
  color:var(--bad);
  background:var(--bad-soft);
  padding:0.15em 0.5em;
  border-radius:6px;
  font-weight:600;
}
.wnote-q{flex:1; font-size:0.86rem; font-weight:600;}
.wnote-chev{flex:none; color:var(--ink-soft); transition:transform 0.15s ease;}
.wnote-item.open .wnote-chev{transform:rotate(180deg);}
.wnote-body{
  display:none;
  padding:0 0.85rem 0.9rem;
}
.wnote-item.open .wnote-body{display:block;}
.wnote-answer{
  font-size:0.82rem;
  padding:0.5rem 0.65rem;
  border-radius:10px;
  background:var(--good-soft);
  color:var(--good);
  font-weight:700;
  margin-bottom:0.55rem;
}
.wnote-explain{font-size:0.8rem; color:var(--ink-soft); line-height:1.55;}

.empty{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:0.4rem;
  color:var(--ink-soft);
  padding:2rem;
}
.empty b{color:var(--ink); font-size:0.95rem;}
.empty span{font-size:0.8rem;}

/* ---- ranking screen ---- */
.seg{
  display:flex;
  background:var(--surface-2);
  border-radius:12px;
  padding:0.25rem;
  margin-bottom:1rem;
}
.seg button{
  flex:1;
  border:none;
  background:transparent;
  padding:0.5rem;
  border-radius:9px;
  font-size:0.82rem;
  font-weight:600;
  color:var(--ink-soft);
  cursor:pointer;
}
.seg button.active{background:var(--surface); color:var(--accent); box-shadow:0 1px 2px rgba(0,0,0,0.06);}

.rank-row{
  display:flex;
  align-items:center;
  gap:0.7rem;
  padding:0.6rem 0.2rem;
  border-bottom:1px solid var(--line);
}
.rank-row:last-child{border-bottom:none;}
.rank-num{
  flex:none;
  width:1.6rem;
  font-family:var(--font-mono);
  font-weight:600;
  font-size:0.85rem;
  color:var(--ink-soft);
  text-align:center;
  font-variant-numeric:tabular-nums;
}
.rank-row.me{
  background:var(--accent-soft);
  border-radius:12px;
  padding-left:0.5rem;
  padding-right:0.5rem;
  border-bottom-color:transparent;
}
.rank-row.me .rank-num{color:var(--accent);}
.rank-avatar{
  flex:none;
  width:2.1rem;height:2.1rem;
  border-radius:50%;
  background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  font-size:0.78rem;
  font-weight:700;
  color:var(--ink-soft);
}
.rank-row.me .rank-avatar{background:var(--accent); color:#fff;}
.rank-name{flex:1; font-size:0.86rem; font-weight:600;}
.rank-score{
  font-family:var(--font-mono);
  font-size:0.82rem;
  font-weight:600;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
}
.rank-row.me .rank-score{color:var(--accent);}

/* ---- tabbar ---- */
.tabbar{
  flex:none;
  display:flex;
  border-top:1px solid var(--line);
  background:var(--surface);
}
.tab{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0.2rem;
  padding:0.6rem 0 0.75rem;
  border:none;
  background:none;
  color:var(--ink-soft);
  cursor:pointer;
}
.tab.active{color:var(--accent);}
.tab span{font-size:0.65rem; font-weight:600;}

/* ---- spec caption ---- */
.spec{
  width:min(380px, 88vw);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:0.8rem 1rem;
  font-size:0.78rem;
  color:var(--ink-soft);
  line-height:1.5;
}
.spec b{
  font-family:var(--font-mono);
  color:var(--accent);
  font-weight:600;
  margin-right:0.3em;
}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;}
}
</style>

<div class="page">

  <div class="head">
    <p class="eyebrow">requirements.md 기반 · MVP 플로우 검증</p>
    <h1>캐시퀴즈 인터랙티브 목업</h1>
    <p>실제로 화면을 눌러보면서 요구사항 문서와 맞는 방향인지 확인해 보세요. 위 알약 버튼으로 특정 화면으로 바로 이동할 수도 있어요.</p>
  </div>

  <div class="jumpbar" id="jumpbar"></div>

  <div class="device-wrap">
    <div class="device">
      <div class="statusbar">
        <span>9:41</span>
        <span class="icons">
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="7" width="3" height="4" rx="0.5" fill="currentColor"/><rect x="4.5" y="5" width="3" height="6" rx="0.5" fill="currentColor"/><rect x="9" y="2.5" width="3" height="8.5" rx="0.5" fill="currentColor"/><rect x="13" y="0" width="3" height="11" rx="0.5" fill="currentColor" opacity="0.35"/></svg>

        </span>
      </div>

      <div class="screen" id="screen"></div>

      <div class="tabbar" id="tabbar"></div>
    </div>
  </div>

  <div class="spec" id="spec"></div>

</div>

<script>
const ICONS = {

const TOPICS = [
  { id:'stock', name:'주식', desc:'PER, 배당, 분산투자 기초', color:'#3d5afe', bg:'#e8ecff', icon:'stock',
    questions:[

        correct:1, explain:'전세는 큰 보증금을 맡기고 월세 부담이 없는 반면, 월세는 보증금이 작은 대신 매달 임대료를 내요.' },
      { q:"'LTV(주택담보대출비율)'가 의미하는 것은?",
        choices:['대출 금리','집값 대비 대출 가능 금액의 비율','전세보증금 반환 비율','주택 재산세율'],
        correct:1, explain:'LTV는 담보가치(집값) 대비 얼마까지 대출받을 수 있는지를 나타내는 비율이에요.' },
      { q:"청약통장의 주된 목적은 무엇인가요?",
        choices:['대출 금리를 낮추기 위해','전세보증금을 보호받기 위해','신규 분양 아파트 청약 자격을 얻기 위해','재산세를 감면받기 위해'],
        correct:2, explain:'청약통장은 일정 요건을 채우면 신규 분양 주택 청약에 신청할 자격을 줘요.' },
      { q:"'등기부등본'에서 확인할 수 없는 것은?",
        choices:['소유자 정보','근저당권 설정 여부','집주인의 소득 수준','압류·가압류 여부'],
        correct:2, explain:'등기부등본은 부동산의 권리관계를 보여주는 서류로, 소유자의 소득 정보는 나오지 않아요.' },
      { q:"'재건축'과 '재개발'의 차이로 옳은 것은?",
        choices:['재건축은 노후 건물 자체를, 재개발은 주변 기반시설까지 포함해 정비한다','재건축은 상업지역만 대상으로 한다','재개발은 세금 감면이 전혀 없다','둘은 완전히 동일한 절차다'],
        correct:0, explain:'재건축은 건물 위주로, 재개발은 도로·상하수도 등 기반시설까지 포함해 지역 전체를 정비해요.' }
    ]},
  { id:'fund', name:'펀드', desc:'ETF, 운용보수, 기준가 기초', color:'#1f8f5c', bg:'#e2f3ea', icon:'fund',
    questions:[
      { q:"'펀드'란 무엇인가요?",
        choices:['은행이 원금을 보장하는 예금 상품','정부가 발행하는 채권','여러 투자자의 돈을 모아 전문가가 대신 운용하는 상품','개인이 직접 매매하는 주식 계좌'],
        correct:2, explain:'펀드는 다수의 투자자 자금을 모아 전문 운용사가 주식·채권 등에 투자하는 간접투자 상품이에요.' },
      { q:"'ETF'의 특징으로 옳은 것은?",
        choices:['하루에 한 번만 가격이 정해지는 예금','원금이 보장되는 채권','부동산 실물을 직접 소유하는 상품','주식처럼 거래소에서 실시간 매매가 가능한 펀드'],
        correct:3, explain:'ETF는 지수 등을 추종하며 주식처럼 실시간으로 사고팔 수 있는 상장지수펀드예요.' },
      { q:"펀드의 '운용보수'란 무엇인가요?",
        choices:['펀드를 운용해주는 대가로 지불하는 수수료','원금 손실을 보전해주는 금액','세금 환급액','배당금의 일종'],
        correct:0, explain:'운용보수는 자산운용사가 펀드를 관리·운용하는 대가로 매년 일정 비율 부과하는 비용이에요.' },
      { q:"'액티브 펀드'와 '패시브 펀드'의 차이는?",
        choices:['액티브는 원금보장, 패시브는 미보장','패시브는 해외투자만 가능','액티브는 매니저가 초과 수익을 노리고, 패시브는 지수를 그대로 추종','둘 다 완전히 동일한 전략을 사용'],
        correct:2, explain:'액티브 펀드는 시장 대비 초과수익을 목표로 적극 운용하고, 패시브 펀드는 특정 지수를 그대로 따라가요.' },
      { q:"펀드 투자 시 '기준가'란 무엇인가요?",
        choices:['펀드 가입 최소 금액','펀드 1좌의 현재 평가 가격','판매사가 받는 수수료율','환매 시 부과되는 세금'],
        correct:1, explain:'기준가는 펀드 자산을 좌수로 나눈 값으로, 매입·환매 시 기준이 되는 가격이에요.' }
    ]}
];

const RANKING = {
  daily:[ ['1','민지','980'],['2','현우','860'],['3','서연','790'],['4','나',680,true],['5','도윤','610'],['6','하은','540'] ],
  weekly:[ ['1','서연','5210'],['2','민지','4980'],['3','나',4420,true],['4','현우','4310'],['5','지호','3990'],['6','도윤','3540'] ]
};

const SPECS = {
  home:'<b>§4-2</b>홈 화면에서 주제(주식/부동산/펀드) 선택 · <b>§3.1</b>토스 자동로그인 연동 전제',
  quiz:'<b>§3.1</b>세션당 5문항 4지선다 · <b>§4-3,4</b>정답 제출 즉시 정답 여부·해설 표시',
  result:'<b>§4-5</b>세션 종료 후 정답 수·획득 포인트·스트릭 갱신 요약 · <b>§6</b>보상(포인트) 정책',
  wrongnote:'<b>§3.1</b>오답노트(틀린 문제 목록 조회) · <b>§4-6</b>오답노트에서 틀린 문제 다시 확인',
  ranking:'<b>§3.1,§7</b>일간/주간 랭킹, 누적 정답 수 기준 산정'
};

let state = {
  tab:'home',
  screen:'home', // home | quiz | result | wrongnote | ranking
  topic:null,
  qIndex:0,
  answered:false,
  selected:null,
  sessionScore:0,
  cash:1240,
  streak:7,
  rankPeriod:'daily',
  wrongNote:[]
};

const screenEl = document.getElementById('screen');
const tabbarEl = document.getElementById('tabbar');
const specEl = document.getElementById('spec');
const jumpEl = document.getElementById('jumpbar');

function go(screen, extra){
  state.screen = screen;
  if(screen!=='quiz' && screen!=='result') state.tab = screen==='wrongnote'?'wrongnote':(screen==='ranking'?'ranking':'home');
  Object.assign(state, extra||{});
  render();
}

function startTopic(topic){
  state.topic = topic;
  state.qIndex = 0;
  state.answered = false;
  state.selected = null;
  state.sessionScore = 0;
  go('quiz');
}

function pickChoice(idx){
  if(state.answered) return;
  state.answered = true;
  state.selected = idx;
  const q = state.topic.questions[state.qIndex];
  if(idx===q.correct){
    state.sessionScore++;
    state.cash += 20;
  } else {
    state.wrongNote.push({topic:state.topic.name, q, chosen:idx});
  }
  render();
}

function nextQuestion(){
  const total = state.topic.questions.length;
  if(state.qIndex < total-1){
    state.qIndex++;
    state.answered = false;
    state.selected = null;
    render();
  } else {
    state.streak += 1;
    go('result');
  }
}

function renderJumpbar(){
  const items = [
    ['home','홈'], ['quiz','퀴즈 풀기'], ['result','결과 화면'], ['wrongnote','오답노트'], ['ranking','랭킹']
  ];
  jumpEl.innerHTML = items.map(([key,label])=>
    `<button class="jump ${state.screen===key?'active':''}" data-jump="${key}">${label}</button>`
  ).join('');
  jumpEl.querySelectorAll('[data-jump]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.jump;
      if(key==='quiz'){ startTopic(state.topic || TOPICS[0]); }
      else if(key==='result'){
        if(!state.topic) state.topic = TOPICS[0];
        state.sessionScore = 4;
        go('result');
      } else go(key);
    });
  });
}

function renderTabbar(){
  if(state.screen==='quiz' || state.screen==='result'){ tabbarEl.style.display='none'; return; }
  tabbarEl.style.display='flex';
  const tabs = [['home','홈','home'],['ranking','랭킹','rank'],['wrongnote','오답노트','note']];
  tabbarEl.innerHTML = tabs.map(([key,label,ic])=>
    `<button class="tab ${state.tab===key?'active':''}" data-tab="${key}">${ICONS[ic]}<span>${label}</span></button>`
  ).join('');
  tabbarEl.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=> go(btn.dataset.tab));
  });
}

function homeHTML(){
  return `
  <div class="scroll">
    <div class="top-chips">
      <div class="chip streak">${ICONS.flame}<div><div class="v">${state.streak}일</div><div class="l">연속 학습</div></div></div>
      <div class="chip gold">${ICONS.coin}<div><div class="v">${state.cash.toLocaleString()}</div><div class="l">보유 포인트</div></div></div>
    </div>
    <p class="greet">오늘도 5문제, 3분이면 충분해요</p>
    <p class="greet-sub">관심 있는 주제를 골라 퀴즈를 시작해 보세요</p>
    <p class="section-label">주제 선택</p>
    <div class="topics">
      ${TOPICS.map(t=>`
        <button class="topic-card" data-topic="${t.id}">
          <div class="topic-ic" style="background:${t.bg};color:${t.color}">${ICONS[t.icon]}</div>
          <div class="topic-body">
            <div class="topic-name">${t.name}</div>
            <div class="topic-desc">${t.desc}</div>
          </div>
          <div class="topic-chev">${ICONS.chev}</div>
        </button>
      `).join('')}
    </div>
  </div>`;
}

function quizHTML(){
  const total = state.topic.questions.length;
  const q = state.topic.questions[state.qIndex];
  const pct = Math.round(((state.qIndex + (state.answered?1:0)) / total) * 100);
  return `
  <div class="quiz-head">
    <button class="iconbtn" id="quiz-close">${ICONS.close}</button>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="qcount">${state.qIndex+1} / ${total}</div>
  </div>
  <div class="scroll">
    <p class="section-label">${state.topic.name}</p>
    <p class="qtext">${q.q}</p>
    <div class="choices">
      ${q.choices.map((c,i)=>{
        let cls='choice';
        if(state.answered){
          if(i===q.correct) cls+=' correct';
          else if(i===state.selected) cls+=' wrong';
        }
        return `<button class="${cls}" data-choice="${i}" ${state.answered?'disabled':''}>
          <span class="mark">${String.fromCharCode(65+i)}</span><span>${c}</span>
        </button>`;
      }).join('')}
    </div>
    ${state.answered? `<div class="explain"><b>${state.selected===q.correct?'정답이에요.':'아쉬워요.'}</b> ${q.explain}</div>` : ''}
  </div>
  <div class="quiz-foot">
    <button class="btn-primary" id="quiz-next" ${state.answered?'':'disabled'}>${state.qIndex<total-1?'다음 문제':'결과 보기'}</button>
  </div>`;
}

function resultHTML(){
  const total = state.topic.questions.length;
  const earned = state.sessionScore*20;
  return `
  <div class="result-wrap">
    <div class="result-score">${state.sessionScore}<span style="font-size:1.2rem;color:var(--ink-soft)"> / ${total}</span></div>
    <p class="result-title">${state.sessionScore===total? '전부 맞혔어요! 완벽해요' : '오늘도 한 걸음 성장했어요'}</p>
    <p class="result-sub">${state.topic.name} 퀴즈 세션이 끝났어요</p>
    <div class="result-stats">
      <div class="result-stat gold"><div class="v">+${earned}</div><div class="l">획득 포인트</div></div>
      <div class="result-stat"><div class="v">${state.streak}일째</div><div class="l">연속 학습</div></div>
    </div>
    <div class="result-actions">
      <button class="btn-primary" id="result-wrong">오답노트 보기</button>
      <button class="btn-ghost" id="result-home">홈으로</button>
    </div>
  </div>`;
}

function wrongnoteHTML(){
  if(state.wrongNote.length===0){
    return `<div class="empty"><b>아직 틀린 문제가 없어요</b><span>퀴즈를 풀면 틀린 문제가 여기에 모여요</span></div>`;
  }
  return `<div class="scroll">
    <p class="section-label">틀린 문제 ${state.wrongNote.length}개</p>
    ${state.wrongNote.map((w,i)=>`
      <div class="wnote-item" data-wnote="${i}">
        <button class="wnote-head">
          <span class="wnote-tag">${w.topic}</span>
          <span class="wnote-q">${w.q.q}</span>
          <span class="wnote-chev">${ICONS.down}</span>
        </button>
        <div class="wnote-body">
          <div class="wnote-answer">정답 · ${w.q.choices[w.q.correct]}</div>
          <div class="wnote-explain">${w.q.explain}</div>
        </div>
      </div>
    `).join('')}
  </div>`;
}

function rankingHTML(){
  const rows = RANKING[state.rankPeriod];
  return `<div class="scroll">
    <div class="seg">
      <button class="${state.rankPeriod==='daily'?'active':''}" data-period="daily">일간</button>
      <button class="${state.rankPeriod==='weekly'?'active':''}" data-period="weekly">주간</button>
    </div>
    ${rows.map(r=>`
      <div class="rank-row ${r[3]?'me':''}">
        <div class="rank-num">${r[0]}</div>
        <div class="rank-avatar">${r[1][0]}</div>
        <div class="rank-name">${r[1]}${r[3]?' (나)':''}</div>
        <div class="rank-score">${Number(r[2]).toLocaleString()}점</div>
      </div>
    `).join('')}
  </div>`;
}

function render(){
  if(state.screen==='home') screenEl.innerHTML = homeHTML();
  else if(state.screen==='quiz') screenEl.innerHTML = quizHTML();
  else if(state.screen==='result') screenEl.innerHTML = resultHTML();
  else if(state.screen==='wrongnote') screenEl.innerHTML = wrongnoteHTML();
  else if(state.screen==='ranking') screenEl.innerHTML = rankingHTML();

  renderTabbar();
  renderJumpbar();
  specEl.innerHTML = SPECS[state.screen] || '';
  bindScreenEvents();
}

function bindScreenEvents(){
  screenEl.querySelectorAll('[data-topic]').forEach(el=>{
    el.addEventListener('click', ()=> startTopic(TOPICS.find(t=>t.id===el.dataset.topic)));
  });
  screenEl.querySelectorAll('[data-choice]').forEach(el=>{
    el.addEventListener('click', ()=> pickChoice(Number(el.dataset.choice)));
  });
  const closeBtn = screenEl.querySelector('#quiz-close');
  if(closeBtn) closeBtn.addEventListener('click', ()=> go('home'));
  const nextBtn = screenEl.querySelector('#quiz-next');
  if(nextBtn) nextBtn.addEventListener('click', nextQuestion);
  const rwBtn = screenEl.querySelector('#result-wrong');
  if(rwBtn) rwBtn.addEventListener('click', ()=> go('wrongnote'));
  const rhBtn = screenEl.querySelector('#result-home');
  if(rhBtn) rhBtn.addEventListener('click', ()=> go('home'));
  screenEl.querySelectorAll('[data-wnote]').forEach(el=>{
    el.addEventListener('click', ()=> el.classList.toggle('open'));
  });
  screenEl.querySelectorAll('[data-period]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.rankPeriod = el.dataset.period; render(); });
  });
}

render();
</script>
